name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Cache voices
        uses: actions/cache@v6
        with:
          path: build/voices
          key: voices-${{ hashFiles('packaging/fetch_voices.py') }}

      - name: Download voices
        run: python packaging/fetch_voices.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          TTS_READER_AUDIO: "null"
        run: python -m unittest discover -s tests -v

      - name: App icon
        run: python packaging/make_icon.py

      - name: PyInstaller
        run: pyinstaller packaging/TTSReader.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selftest.log"
          $p = Start-Process -FilePath dist\TTSReader\TTSReader.exe -ArgumentList "--self-test", "`"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\TTSReader -DestinationPath "dist\TTSReader-$env:APP_VERSION-portable.zip"
          Get-ChildItem dist -File | Format-Table Name, @{n="MB"; e={[math]::Round($_.Length / 1MB)}}

      # Releases, not workflow artifacts: private repos only get a small
      # artifact quota and one build is a few hundred MB.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TTSReader-Setup-*.exe dist/TTSReader-*-portable.zip \
            --title "TTS Reader $APP_VERSION" \
            --notes "Download **TTSReader-Setup-$APP_VERSION.exe** and run it (installs for your user, no admin needed). The portable zip is the same app unpacked - extract it anywhere and run TTSReader.exe."
